name: build
on: [ push, pull_request ]
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'  # Explicitly set Go version
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  build:
    name: Go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          go-version: 1.24.2
      - name: Build
        run: |
          git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}
          cd $(basename ${GITHUB_REPOSITORY})
          go build -v -race

  test:
    name: Go test
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the coverage badge to the badges branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      - name: Check coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml
          git-token: ${{ github.event_name == 'push' && github.ref_name == 'master' && secrets.GITHUB_TOKEN || '' }}
          git-branch: badges

      - name: Coverage summary
        if: ${{ !cancelled() && steps.coverage.outputs.report != '' }}
        env:
          REPORT: ${{ fromJSON(steps.coverage.outputs.report) }}
        run: |
          {
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

name: build
on: [ push, pull_request ]
permissions:
  contents: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'  # Explicitly set Go version
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6

  build:
    name: Go build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          go-version: 1.24.2
      - name: Build
        run: |
          git clone --depth=1 https://github.com/${GITHUB_REPOSITORY}
          cd $(basename ${GITHUB_REPOSITORY})
          go build -v -race

  test:
    name: Go test
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.total-coverage }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...

      - name: Check coverage
        id: coverage
        uses: vladopajic/go-test-coverage@f94bcf0d6b9fa5fb8b783830b22648f6c17475e2 # v2.19.0
        with:
          config: ./.testcoverage.yml

      - name: Coverage summary
        if: ${{ !cancelled() && steps.coverage.outputs.report != '' }}
        env:
          REPORT: ${{ fromJSON(steps.coverage.outputs.report) }}
        run: |
          {
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage-badge:
    name: Coverage badge
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    permissions:
      issues: write # the README coverage badge shows the title of issue #162
    steps:
      - name: Update coverage badge
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE: ${{ needs.test.outputs.coverage }}
        run: |
          test -n "$COVERAGE"
          title="$COVERAGE%"
          current=$(gh issue view 162 --repo "$GITHUB_REPOSITORY" --json title --jq .title)
          if [ "$current" != "$title" ]; then
            gh issue edit 162 --repo "$GITHUB_REPOSITORY" --title "$title"
          fi
